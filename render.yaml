# Render Blueprint — production site for nationdesignconstruction.com.
# SITE_ENV=production: complete pages are indexable; services in "preview" stay noindex until published in admin.
# Rollback: Render dashboard → nationdc → Events → pick an earlier deploy → "Rollback", or `git revert` + push.
services:
  - type: web
    name: nationdc
    runtime: node
    plan: starter            # a persistent disk (database + private uploads) needs a paid instance
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: node tools/check-content.mjs
    startCommand: node src/server/main.mjs
    healthCheckPath: /healthz
    domains:
      - nationdesignconstruction.com
      - www.nationdesignconstruction.com
    disk:
      name: ndc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SITE_ENV
        value: production
      - key: SITE_URL
        value: https://nationdesignconstruction.com
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY_HOPS     # X-Forwarded-For on Render = "<client>, <edge>"
        value: "2"
      - key: COOKIE_SECURE
        value: "1"
      - key: FORM_SECRET          # signs form timing tokens
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL     # first admin login; entered when the Blueprint is created
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD  # generated by Render; read it in the service's Environment tab, then change it in admin
        generateValue: true
      # Optional, add later in the dashboard (never commit values):
      #   RESEND_API_KEY, EMAIL_FROM                — lead notifications (also needs a verified inbox in admin)
      #   TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY  — extra spam protection
